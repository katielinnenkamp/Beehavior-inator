<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Serious Professional Website</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="login-page.js"></script>
</head>

<body>
  <main class="home-container">
    <!-- note to self, username is admin ;) -->
    <h1>Very Important Data Inside. Please don't hack!</h1>
    <p class="subtitle">Please Login.</p>

    <form class="login-form" id="login" action="#" method="post">
      <label for="username">Email or Username</label>
      <input
        id="username"
        name="login"
        type="text"
        placeholder="yourname@ex.com"
        autocomplete="username"
        required
      />
      <button type="submit" id="login-button">Login</button>
    </form>
  </main>
</body>
</html>
