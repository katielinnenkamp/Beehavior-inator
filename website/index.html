<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Serious Professional Website</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="home-container">
    <h1>Very Important Data Inside. Please don't hack!</h1>
    <p class="subtitle">Please Login.</p>

    <form class="login-form" action="standin.html" method="post">
      <label for="login">Email or Username</label>
      <input
        id="login"
        name="login"
        type="text"
        placeholder="yourname@ex.com or yourname"
        autocomplete="username"
        required
      />

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        placeholder="••••••••••••"
        autocomplete="password"
        required
      />

      <button type="submit">Login</button>

      <p class="sub-submit">
        New user? <a href="createacc.html">Create an account</a>
      </p>
    </form>
  </main>
</body>
</html>
