<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8 />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create an Account</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="home-container">
    <h1>Create an Account</h1>
    <p class="subtitle">We really want you to see all of the important data inside.</p>

    <form class="login-form" id="createform" action="standin.html" method="post">
      <label for="username">Username</label>
      <input
        id="username"
        name="username"
        type="text"
        placeholder="yourname"
        required
      />

      <label for="email">Email</label>
      <input
        id="email"
        name="email"
        type="text"
        placeholder="yourname@ex.com"
        required
      />

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        placeholder="••••••••••••"
        required
      />

      <label for="confirm">Confirm Password</label>
      <input
        id="confirm"
        name="confirm"
        type="password"
        placeholder="••••••••••••"
        required 
      />

      <p id="error" class="error hidden">Passwords do not match</p>
        

      <button type="submit">Create Account</button>
 
      <p class="sub-submit">
        Already have an account?
        <a href="index.html">Login</a>
      </p>
    </form>
  </main>

  <script>
    const form = document.getElementById("createform");
    const password = document.getElementById("password");
    const confirm = document.getElementById("confirm");
    const error = document.getElementById("error");

    form.addEventListener("submit", (e) => {
      if (password.value !== confirm.value) {
        e.preventDefault();
        error.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
